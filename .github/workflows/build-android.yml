name: Build Android APK

# The APK is built here rather than locally because the Android SDK, the
# Android Gradle Plugin and androidx all come from Google's servers, which
# aren't reachable from every development environment. GitHub's runners have
# the SDK preinstalled.
on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/**'
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'icon-*.png'
      - 'android/**'
      - 'scripts/**'
      - 'package*.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Copy app shell into www/ and sync native project
        run: |
          npm run build
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Report APK details
        run: |
          apk=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "Built: $apk ($(du -h "$apk" | cut -f1))"
          echo "APK_PATH=$apk" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gauge-s-downloader-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
