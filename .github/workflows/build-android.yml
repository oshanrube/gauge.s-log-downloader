name: Build Android APK

# The APK is built here rather than locally because the Android SDK, the
# Android Gradle Plugin and androidx all come from Google's servers, which
# aren't reachable from every development environment. GitHub's runners have
# the SDK preinstalled.
on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/**'
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'icon-*.png'
      - 'android/**'
      - 'scripts/**'
      - 'package*.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    # Needed to create/update the release on a manual run.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Copy app shell into www/ and sync native project
        run: |
          npm run build
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Report APK details
        run: |
          apk=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "Built: $apk ($(du -h "$apk" | cut -f1))"
          echo "APK_PATH=$apk" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gauge-s-downloader-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # Actions artifacts need a GitHub login and arrive as a zip, which is
      # painful on a phone. A release asset is a direct tap-to-install link.
      # Manual runs only, so ordinary pushes don't publish releases.
      - name: Attach APK to a release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="v${version}"
          asset="gauge-s-downloader-${tag}-debug.apk"
          cp "$APK_PATH" "$asset"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag exists — replacing the APK asset."
            gh release upload "$tag" "$asset" --clobber
          else
            echo "Creating release $tag."
            gh release create "$tag" "$asset" \
              --target "$GITHUB_SHA" \
              --title "Gauge.S Downloader $tag — Android (debug)" \
              --prerelease \
              --notes "Android build of the Gauge.S log downloader.

          Unlike the web app, this one can **delete files from the device**: requests go
          through the OS HTTP stack, so there is no CORS preflight for the firmware to
          drop and no mixed-content restriction. See [NATIVE.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/NATIVE.md).

          **Install:** download the \`.apk\` below and open it. Android will ask you to
          allow installing from unknown sources.

          This is a **debug-signed** build for sideloading — not a Play Store release.
          It has not yet been tested against real Gauge.S hardware."
          fi

          echo "Release URL: $(gh release view "$tag" --json url -q .url)"
