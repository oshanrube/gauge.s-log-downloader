name: Build Android APK

# The APK is built here rather than locally because the Android SDK, the
# Android Gradle Plugin and androidx all come from Google's servers, which
# aren't reachable from every development environment. GitHub's runners have
# the SDK preinstalled.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'claude/**'

# Two merges landing together would otherwise race to push the version bump.
# Queue rather than cancel: a cancelled run is a release that never happened.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    # Needed to create/update the release on a manual run.
    permissions:
      contents: write

    steps:
      # Full history: a release merge rebases its version bump onto whatever
      # landed while it built, which a shallow clone cannot do.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Merging is the act of releasing, so the patch moves on its own rather
      # than relying on whoever opened the pull request to remember. Done before
      # the build so the APK, the service worker cache key and the release all
      # carry the same number.
      - name: Work out the version
        id: version
        env:
          IS_MAIN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          current=$(node -p "require('./package.json').version")

          if [ "$IS_MAIN" != "true" ]; then
            echo "Not a merge to main - building $current without releasing."
            echo "version=$current" >> "$GITHUB_OUTPUT"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          next=$(node scripts/bump-version.mjs --write)

          echo "Releasing $current -> $next"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "bumped=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      # The diagnostic pipeline has no compiler to catch it going wrong: a
      # broken detector still builds, installs and runs, and simply reports the
      # wrong thing. These are the assertions that stop that shipping.
      - name: Run pipeline tests
        run: npm test

      - name: Copy app shell into www/ and sync native project
        run: |
          npm run build
          npx cap sync android

      # Present only once the release keystore secrets are configured; until
      # then the build falls back to a debug APK so nothing is blocked.
      - name: Decode release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore decoded."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No KEYSTORE_BASE64 secret — falling back to a debug build."
          fi

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            # Play requires an .aab; the .apk is still built alongside it for
            # sideloading, since a bundle cannot be installed directly.
            task="assembleRelease bundleRelease"
          else
            task=assembleDebug
          fi
          # No --stacktrace: it buries Gradle's own "What went wrong" summary
          # under hundreds of frames. The log is kept so the failure step below
          # can surface just the useful part.
          ./gradlew reportSigning $task --no-daemon | tee "$RUNNER_TEMP/gradle.log"

      - name: Show the Gradle failure
        if: failure()
        run: |
          echo "===== Gradle failure ====="
          sed -n '/^FAILURE:/,/^\* Get more help/p' "$RUNNER_TEMP/gradle.log" | head -60
          echo "===== last errors ====="
          grep -iE '^(e:|error:)|Execution failed|Caused by|> ' "$RUNNER_TEMP/gradle.log" | tail -30

      - name: Report APK details
        run: |
          set -euo pipefail
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            variant=release
          else
            variant=debug
          fi
          apk=$(find "android/app/build/outputs/apk/$variant" -name '*.apk' ! -name '*unsigned*' | head -1)
          echo "Built: $apk ($(du -h "$apk" | cut -f1))"
          echo "APK_PATH=$apk" >> "$GITHUB_ENV"
          echo "APK_VARIANT=$variant" >> "$GITHUB_ENV"

          # Only release builds produce a bundle — a debug .aab is no use to Play.
          aab=$(find android/app/build/outputs/bundle -name '*.aab' 2>/dev/null | head -1)
          if [ -n "$aab" ]; then
            echo "Bundle: $aab ($(du -h "$aab" | cut -f1))"
            echo "AAB_PATH=$aab" >> "$GITHUB_ENV"
          fi

          # The SHA-1 below is what a Google Cloud Android OAuth client must be
          # registered against, alongside the package name. It is printed on
          # every build so a key change is impossible to miss.
          echo "--- signing certificate ---"
          # Explicit path rather than bare `keytool`: this is the value needed
          # to register the Google OAuth client, so it must not go missing if
          # PATH ever changes.
          "${JAVA_HOME}/bin/keytool" -printcert -jarfile "$apk" \
            | grep -E 'Owner:|Valid from:|SHA1:|SHA256:'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gauge-s-downloader-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30

      # Actions artifacts need a GitHub login and arrive as a zip, which is
      # painful on a phone. A release asset is a direct tap-to-install link.
      # Manual runs only, so ordinary pushes don't publish releases.
      # The bump has to be on main before the tag can point at it, and it must
      # not set this workflow off again. A push made with GITHUB_TOKEN does not
      # trigger workflows, and [skip ci] says so for any reader.
      - name: Put the version bump on main
        id: bump
        if: steps.version.outputs.bumped == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json sw.js index.html
          git commit -m "Release v${VERSION} [skip ci]"

          # Another merge may have landed while this built; rebase onto it
          # rather than failing a release that is otherwise ready to go.
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::error::could not push the version bump to main"
          exit 1

      - name: Attach APK to a release
        if: github.event_name == 'workflow_dispatch' || steps.version.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          # A manual run republishes an existing release on purpose. An
          # automatic one must never overwrite: the version has just been
          # bumped, so a tag that already exists means something is wrong.
          ALLOW_CLOBBER: ${{ github.event_name == 'workflow_dispatch' }}
          TARGET_SHA: ${{ steps.bump.outputs.sha || github.sha }}
        run: |
          set -euo pipefail
          version="$VERSION"
          tag="v${version}"

          # Two assets from one APK: a versioned name so downloads are
          # identifiable, and a fixed name so the in-app install link
          # (/releases/latest/download/gauge-s-downloader-latest.apk) keeps
          # working across versions without editing index.html.
          versioned="gauge-s-downloader-${tag}-${APK_VARIANT}.apk"
          stable="gauge-s-downloader-latest.apk"
          cp "$APK_PATH" "$versioned"
          cp "$APK_PATH" "$stable"

          # The Play upload artefact, when this was a release build.
          assets=("$versioned" "$stable")
          if [ -n "${AAB_PATH:-}" ]; then
            cp "$AAB_PATH" "gauge-s-downloader-${tag}.aab"
            assets+=("gauge-s-downloader-${tag}.aab")
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "$ALLOW_CLOBBER" != "true" ]; then
              echo "::error::$tag already exists, and an automatic release must not overwrite one."
              exit 1
            fi
            echo "Release $tag exists — replacing the assets."
            gh release upload "$tag" "${assets[@]}" --clobber
            # Older runs published this as a prerelease, which /releases/latest
            # skips over. Promote it so the install link resolves.
            gh release edit "$tag" --prerelease=false --latest
          else
            echo "Creating release $tag."
            gh release create "$tag" "${assets[@]}" \
              --target "$TARGET_SHA" \
              --title "Gauge.S Downloader $tag — Android" \
              --latest \
              --notes "Android build of the Gauge.S log downloader.

          Unlike the web app, this one can **delete files from the device**: requests go
          through the OS HTTP stack, so there is no CORS preflight for the firmware to
          drop and no mixed-content restriction. See [NATIVE.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/NATIVE.md).

          It also pins its sockets to the Gauge.S Wi-Fi, so the device stays reachable
          while Android reports 'no internet'.

          **Install:** download \`gauge-s-downloader-latest.apk\` below and open it.
          Android will ask you to allow installing from unknown sources.

          Built as a **${APK_VARIANT}** APK for sideloading. Any \`.aab\` alongside it is
          the Play Store upload artefact and cannot be installed directly."
          fi

          echo "Release URL: $(gh release view "$tag" --json url -q .url)"
